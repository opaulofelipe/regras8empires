<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Estrada</title>
  <desc id="desc">Ilustração minimalista de uma estrada ligando dois pontos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12110f"/>
      <stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9f7435"/>
      <stop offset=".5" stop-color="#e0bb74"/>
      <stop offset="1" stop-color="#9f7435"/>
    </linearGradient>
    <radialGradient id="node" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#d3ac67"/>
      <stop offset="1" stop-color="#8d652f"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity=".28" stroke="#d7aa5a">
    <circle cx="235" cy="300" r="118" fill="none"/>
    <circle cx="965" cy="300" r="118" fill="none"/>
  </g>
  <g filter="url(#soft)">
    <path d="M350 300 H850" fill="none" stroke="#5f492c" stroke-width="56" stroke-linecap="round"/>
    <path d="M350 300 H850" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M385 300 H815" fill="none" stroke="#d6ac64" stroke-width="8" stroke-dasharray="42 34" stroke-linecap="round"/>
    <circle cx="235" cy="300" r="94" fill="#0d0c0a" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="965" cy="300" r="94" fill="#0d0c0a" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="235" cy="300" r="49" fill="url(#node)" stroke="#e0bb74" stroke-width="3"/>
    <circle cx="965" cy="300" r="49" fill="url(#node)" stroke="#e0bb74" stroke-width="3"/>
  </g>
  <g fill="#d7aa5a">
    <path d="M235 148 l9 36 -9 22 -9-22z"/>
    <path d="M235 452 l9-36 -9-22 -9 22z"/>
    <path d="M83 300 l36-9 22 9 -22 9z"/>
    <path d="M387 300 l-36-9 -22 9 22 9z"/>
    <path d="M965 148 l9 36 -9 22 -9-22z"/>
    <path d="M965 452 l9-36 -9-22 -9 22z"/>
    <path d="M813 300 l36-9 22 9 -22 9z"/>
    <path d="M1117 300 l-36-9 -22 9 22 9z"/>
  </g>
</svg>